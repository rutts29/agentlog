[project]
name = "agentlog"
version = "0.1.0"
description = "Local-first analysis of AI coding agent transcripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "xxhash>=3.0",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "httpx>=0.27,<0.29",
    "mcp>=2.0,<3",
    "watchdog>=6.0,<7",
]

[project.scripts]
agentlog = "agentlog.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlog"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentlog/analysis/extractors/prompts/ux_extraction_subagent.md" = "agentlog/analysis/extractors/prompts/ux_extraction_subagent.md"
"src/agentlog/analysis/coach/prompts/terra_synthesis.md" = "agentlog/analysis/coach/prompts/terra_synthesis.md"
