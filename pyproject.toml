[project]
name = "agentlog"
version = "0.1.0"
description = "Local-first analysis of AI coding agent transcripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "xxhash>=3.0",
]

[project.scripts]
agentlog = "agentlog.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlog"]
